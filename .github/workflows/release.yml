# Native bundles are built/staged here; byt owns checksums and publishing.
# No models/recordings are downloaded or redistributed. Hosted builds do not
# establish model/GPU/playback qualification; see docs/portable-engines.md.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  bundles:
    uses: ./.github/workflows/bundles.yml

  publish:
    needs: bundles
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/byteowlz/byt:latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: dist-*
          merge-multiple: true

      - name: Checksums + GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          byt release checksums
          byt release publish --tag "${{ inputs.tag || github.ref_name }}"
