[package]
name = "spqx-core"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "spqx TTS engine: fast Qwen3-TTS inference (MLX / libtorch backends)"
keywords = ["tts", "text-to-speech", "qwen", "ai", "machine-learning"]
categories = ["multimedia::audio", "science"]
exclude = ["models/", "*.wav", ".DS_Store"]

[lib]
name = "spqx_core"

[dependencies]
# PyTorch bindings via libtorch (0.20 for PyTorch 2.7.1 compatibility)
# Only used with the tch-backend feature
tch = { version = "0.20", optional = true }

# Tokenization
tokenizers = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio processing
hound = "3.5"
# Pure-Rust decoder for non-WAV reference audio (MP3, FLAC, OGG/Vorbis, M4A/AAC).
# WAV is handled by hound; symphonia owns every other container. Reuses the
# 0.5.x tree already pulled in by rodio (spqx-cli) to avoid a duplicate dep.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "aac", "ogg", "isomp4"] }
rubato = "0.16"
mp3lame-encoder = "0.2"
flacenc = "0.5"
audiopus = "0.2"
audiopus_sys = { version = "0.1", features = ["static"] }
ogg = "0.9"

# HTTP and file handling
base64 = "0.22"
url = "2.5"

# Error handling
thiserror = "2.0"
anyhow = "1.0"
libloading = { version = "0.8", optional = true }
schemars = "0.8"

# Logging
tracing = "0.1"

# API server
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["mlx", "qwentts"]
# Whole-pipeline portable runtime, loaded from a pinned native library.
qwentts = ["dep:libloading"]
# Legacy tensor-level diagnostic/example binaries.
legacy-tools = []
# Optional legacy dense libtorch/PyTorch tensor backend.
tch-backend = ["dep:tch"]
# Use Apple MLX as the computation backend (macOS Apple Silicon only).
# Requires the mlx-c git submodule: `git submodule update --init --recursive`
mlx = []

[[example]]
name = "test_weights"
required-features = ["legacy-tools"]

[build-dependencies]
cmake = "0.1"

[[bin]]
name = "tts"
path = "src/bin/tts.rs"
required-features = ["legacy-tools"]

[[bin]]
name = "voice_clone"
path = "src/bin/voice_clone.rs"
required-features = ["legacy-tools"]

[[bin]]
name = "api_server"
path = "src/bin/api_server.rs"
required-features = ["legacy-tools"]

[[bin]]
name = "spqx-tts-worker"
path = "src/bin/worker.rs"

# Compatibility alias for the upstream (Pipi/PiBot) binary name; same code.
[[bin]]
name = "pibot-tts-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "qwen3-tts"
path = "src/bin/qwen3_tts_cli.rs"
required-features = ["legacy-tools"]

[[bin]]
name = "trace_vocoder"
path = "src/bin/trace_vocoder.rs"
required-features = ["legacy-tools"]

[[bin]]
name = "trace_rust"
path = "src/bin/trace_rust.rs"
required-features = ["legacy-tools"]

[dev-dependencies]
tempfile = "3.14"
