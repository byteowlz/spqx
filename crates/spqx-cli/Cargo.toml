[package]
name = "spqx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "spqx: fast local text-to-speech with voice cloning (CLI)"

[[bin]]
name = "spqx"
path = "src/main.rs"

[features]
# One backend must be selected. mlx is the default on Apple Silicon.
default = ["mlx", "qwentts", "playback"]
mlx = ["spqx-core/mlx"]
tch = ["spqx-core/tch-backend"]
qwentts = ["spqx-core/qwentts"]
playback = ["dep:rodio"]

[dependencies]
spqx-core = { path = "../spqx-core", default-features = false }
anyhow = "1.0"
hound = "3.5"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
env_logger = "0.11"
log = "0.4"
rodio = { version = "0.20", optional = true }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = "2.12"
sha2 = "0.10"
fs2 = "0.4"
voqx-core = { git = "https://github.com/byteowlz/voqx.git", rev = "36ca757a7f4f5f28bfc2b4ed97cfe63919e5082e", default-features = false }
# Atomic model-download staging in production code as well as tests.
tempfile = "3"

[dev-dependencies]
tempfile = "3"
